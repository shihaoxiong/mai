spring:
  application:
    name: java-deerflow-backend
  ai:
    model:
      chat: minimax
    minimax:
      api-key:
      chat:
        options:
          model: MiniMax-M2.7-highspeed

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

server:
  shutdown: graceful

mai:
  workspace:
    base-dir: data/threads
  runtime-config:
    file: data/runtime-config/runtime-config.json
  runtime:
    checkpoint:
      base-dir: data/checkpoints
  memory:
    base-dir: data/memory
    injection:
      enabled: true
      max-facts: 3
      min-confidence: 0.7
      strategy: append-to-user-input
